[package]
name = "jsonschema-example-pyo3"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "jsonschema_example_pyo3"
crate-type = ["cdylib"]
test = false

[dependencies]
# Outside this repository: `jsonschema = { version = "...", features = ["macros", "pyo3"] }`.
jsonschema = { path = "../../crates/jsonschema", features = ["macros", "pyo3"] }
pyo3 = { version = "0.29", features = ["extension-module"] }
serde_json = "1"
