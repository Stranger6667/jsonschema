name: Benchmarks

on:
  push:
    branches:
      - "master"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - ".cargo/**"
      - ".github/workflows/codspeed.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: jsonschema
            package: jsonschema
            features: "--features macros"
            benches: "--bench jsonschema --bench keywords --bench errors --bench location --bench metaschema --bench unevaluated_items --bench unevaluated_properties"
          - name: codegen
            package: jsonschema
            features: "--features macros"
            benches: "--bench codegen"
          - name: canonicalize
            package: jsonschema
            # Both bindings canonicalize with arbitrary precision and the compile-time metaschema
            # validators, so the numeric work and the schema check this bench measures are the ones
            # they actually run.
            features: "--features macros,arbitrary-precision"
            benches: "--bench canonicalize --bench canonicalize_many"
          - name: jsonb
            package: jsonschema
            features: "--features jsonb"
            benches: "--bench jsonb"
          - name: codegen-generate
            package: jsonschema-macros-core
            features: "--features bench"
            benches: "--bench generate"
          - name: referencing
            package: referencing
            features: ""
            benches: ""
    name: "Run benchmarks (${{ matrix.name }})"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          key: ${{ matrix.name }}

      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-codspeed

      - run: cargo codspeed build -p ${{ matrix.package }} ${{ matrix.features }} ${{ matrix.benches }}

      - uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          run: cargo codspeed run -p ${{ matrix.package }}
          mode: "simulation"
          token: ${{ secrets.CODSPEED_TOKEN }}

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: "Run benchmarks (python)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
          key: python

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: uv python install 3.14

      - name: Build and install extension
        working-directory: crates/jsonschema-py
        env:
          MATURIN_STRIP: "false"
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
        run: |
          uv venv --python 3.14
          uv pip install ".[bench]" ../jsonschema-bench-pyo3

      - uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          working-directory: crates/jsonschema-py
          run: .venv/bin/pytest benches/bench.py -k '(jsonschema-rs or not jsonschema) and not py-parse' --codspeed
          mode: "simulation"
          token: ${{ secrets.CODSPEED_TOKEN }}

  ruby:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - group: runtime
          - group: meta
          - group: codegen
            codegen: "1"
    name: "Run benchmarks (ruby-${{ matrix.group }})"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      # The codegen group builds every crate the other groups do, so its cache serves all three.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' && matrix.group == 'codegen' }}
          key: ruby

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          working-directory: crates/jsonschema-rb
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build extension
        working-directory: crates/jsonschema-rb
        run: bundle exec rake compile
        env:
          JSONSCHEMA_RB_CODEGEN_BENCH: ${{ matrix.codegen }}

      - uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          working-directory: crates/jsonschema-rb
          config: crates/jsonschema-rb/codspeed-${{ matrix.group }}.yml
          mode: "simulation"
          token: ${{ secrets.CODSPEED_TOKEN }}
