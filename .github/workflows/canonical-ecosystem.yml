name: Canonical ecosystem

on:
  pull_request:
    paths:
      - "crates/jsonschema/src/canonical/**"
      - "crates/jsonschema/src/**/canonical*.rs"
      - "crates/jsonschema/Cargo.toml"
      - "crates/jsonschema-referencing/src/**"
      - "ecosystem/**"
      - ".github/workflows/canonical-ecosystem.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  diff:
    name: Canonicalize the corpus at the base and the PR
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: new
          # On a PR the checkout is the merge commit; its first parent is the base branch tip.
          fetch-depth: 2
          persist-credentials: false

      - name: Check out the base
        run: |
          git -C new worktree add --detach ../old HEAD^1
          # The base may predate the harness or carry an older copy of it.
          rm -rf old/ecosystem
          cp -r new/ecosystem old/ecosystem
          echo "Base: $(git -C old log -1 --format='%h %s')"
          echo "New:  $(git -C new log -1 --format='%h %s')"

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "new/ecosystem -> ../../target"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          # Keep in step with `CORPUS_COMMIT` in ecosystem/ecosystem.py.
          key: canonical-ecosystem-corpus-8726f8205a01a5215d2009a21321d90bda1dfd6d

      - name: Fetch the corpus
        run: python3 new/ecosystem/ecosystem.py fetch --corpus corpus

      - name: Build
        run: |
          mkdir bin
          for side in old new; do
            cargo build --release --manifest-path "$side/ecosystem/Cargo.toml"
            cp target/release/canonical-ecosystem "bin/$side"
          done

      - name: Canonicalize
        run: |
          for side in old new; do
            python3 new/ecosystem/ecosystem.py run --binary "bin/$side" --corpus corpus --output "$side.jsonl"
          done

      - name: Report
        id: report
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir report
          python3 new/ecosystem/ecosystem.py report \
            --old old.jsonl --new new.jsonl --old-binary bin/old --new-binary bin/new --corpus corpus \
            --output report/comment.md --full-output report/full.md \
            || echo "crashed=true" >> "$GITHUB_OUTPUT"
          cat report/full.md >> "$GITHUB_STEP_SUMMARY"
          echo "${PR_NUMBER}" > report/pr-number

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-ecosystem
          path: report/
          retention-days: 14

      # Kept apart so the comment job downloads only the report.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical-ecosystem-data
          path: |
            old.jsonl
            new.jsonl
          retention-days: 14

      - name: Fail on new crashes or timeouts
        if: steps.report.outputs.crashed == 'true'
        run: |
          echo "::error::Canonicalization crashes or times out on documents it handled before; see the summary."
          exit 1
