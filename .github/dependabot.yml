version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "cargo"
    directories:
      - "/"
      # Standalone manifest the source gem builds from
      - "/crates/jsonschema-rb/ext/jsonschema"
    schedule:
      interval: "weekly"
    groups:
      # One PR per dependency covering both manifests
      cargo:
        patterns: ["*"]
        group-by: dependency-name
  - package-ecosystem: "pip"
    directory: "/crates/jsonschema-py"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
