[package]
name = "jsonschema-suite-pyo3"
publish = false
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "jsonschema_suite_pyo3"
crate-type = ["cdylib"]

[dependencies]
jsonschema = { path = "../jsonschema", features = ["macros", "pyo3", "resolve-file"] }
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
referencing = { path = "../jsonschema-referencing" }
testsuite = { package = "jsonschema-testsuite", path = "../jsonschema-testsuite" }

[lints]
workspace = true
